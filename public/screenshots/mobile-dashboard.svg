  <text x="50" y="772" fill="#16A34A" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Dashboard</text>
  <text x="150" y="772" fill="#71717A" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Transaksi</text>
