  <text x="368" y="578" fill="#22C55E" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">+Rp 8.000.000</text>
  
  <rect x="32" y="604" width="28" height="28" rx="6" fill="#DC2626" opacity="0.15"/>
  <text x="68" y="616" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Tagihan Internet</text>
  <text x="68" y="628" fill="#71717A" font-family="system-ui, sans-serif" font-size="10">Bills • 08 Sep</text>
  <text x="368" y="622" fill="#DC2626" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">-Rp 475.000</text>
  
  <!-- Mobile Bottom Tab Bar -->
